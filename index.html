<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CP9 SQUADRA - COLLECTION</title>
  <style>
    :root{
      --gold:#d4af37;
      --rare-red:#b30000;
      --puzzle-blue:#0077b6;
      --bg-dark:#0a0a0a;
    }
    body{
      font-family:'Segoe UI',Roboto,sans-serif;
      background:var(--bg-dark);
      color:#fff;
      margin:0;padding:0;text-align:center;
    }
    .header{
      background:linear-gradient(to bottom,#1a1a1a,#000);
      padding:40px 20px;
      border-bottom:2px solid var(--gold);
    }
    h1{margin:0;letter-spacing:5px;color:var(--gold);font-size:2.2em;text-transform:uppercase;}

    .status-panel{
      background:#111;margin:20px;padding:15px;border-radius:15px;border:1px solid #333;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .status-left{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;}
    .status-right{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

    .pill{
      border:1px solid #333;background:#0d0d0d;color:#fff;
      padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer;
    }
    .pill.gold{background:var(--gold);color:#000;border:none;}

    .card-container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
      gap:12px;padding:20px;
    }
    .card-item{
      background:#151515;border:2px solid #222;border-radius:12px;overflow:hidden;position:relative;
      transition:all .35s ease;
      filter:grayscale(100%) brightness(50%);
    }
    .card-item.active{
      border-color:var(--gold);
      filter:grayscale(0%) brightness(100%);
      box-shadow:0 0 15px rgba(212,175,55,.3);
      transform:translateY(-5px);
    }
    .card-item img{width:100%;display:block;}
    .card-label{font-size:.65em;padding:8px 2px;font-weight:900;background:#000;}

    .rarity-tag{
      position:absolute;top:6px;left:6px;
      font-size:.55em;padding:3px 6px;border-radius:4px;text-transform:uppercase;z-index:10;
    }
    .legend{background:var(--gold);color:#000;}
    .rare{background:var(--rare-red);}
    .puzzle{background:var(--puzzle-blue);}

    .scan-btn{
      background:var(--gold);color:#000;
      padding:18px 40px;border-radius:50px;font-weight:900;text-decoration:none;
      display:inline-block;margin:20px 0 50px;
      box-shadow:0 4px 15px rgba(212,175,55,.4);
    }

    #reward-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,.95);z-index:10000;display:none;
      flex-direction:column;justify-content:center;align-items:center;padding:20px;
    }
    .reward-box{
      width:92%;max-width:420px;
      border:3px solid var(--gold);border-radius:20px;padding:18px;background:#111;text-align:center;
    }
    .btn{
      background:var(--gold);border:none;padding:10px 16px;border-radius:10px;
      font-weight:900;cursor:pointer;margin-top:12px;
    }
    .btn.dark{background:#222;color:#fff;border:1px solid #333;}

    #register-modal{
      position:fixed;inset:0;z-index:11000;display:none;
      background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px;
    }
    .modal-box{
      width:92%;max-width:460px;background:#0f0f0f;border:1px solid #333;border-radius:18px;
      padding:18px;text-align:left;
    }
    .field{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
    .field input{
      background:#070707;border:1px solid #2a2a2a;color:#fff;border-radius:12px;
      padding:12px;font-weight:800;outline:none;
    }

    #confetti{position:fixed;inset:0;pointer-events:none;z-index:12000;}
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="header">
    <h1>CP9 SQUADRA</h1>
    <p style="color:#888;font-size:.9em;margin:10px 0 0;">NICE NIGHTLIFE • COLLECTION</p>
  </div>

  <div class="status-panel">
    <div class="status-left">
      <div style="color:var(--gold);font-weight:900;">VOTRE COLLECTION</div>
      <div style="font-size:1.5em;font-weight:900;"><span id="count">0</span> / 12</div>
      <div id="profile-badge" style="color:#aaa;font-size:.85em;">Profil: non inscrit</div>
    </div>
    <div class="status-right">
      <button class="pill" onclick="openRegister()">📝 S’INSCRIRE</button>
      <button class="pill" onclick="resetAll()">RESET</button>
    </div>
  </div>

  <h3 style="color:var(--puzzle-blue);margin:10px 0 0;">🧩 PUZZLES</h3>
  <div class="card-container" id="grid-puzzles"></div>

  <h3 style="color:var(--rare-red);margin:10px 0 0;">💎 CARTES RARES</h3>
  <div class="card-container" id="grid-exclu"></div>

  <div style="margin-top: 30px;">
    <p style="color: #666; font-size: 0.8em;">Scannez le QR Code derrière vos cartes pour les ajouter.</p>
  </div>

  <div id="reward-overlay">
    <div class="reward-box">
      <h2 id="reward-title" style="color:var(--gold);margin:0 0 8px;">BRAVO !</h2>
      <p id="reward-desc" style="color:#ddd;margin:0;white-space:pre-line;"></p>
      <button class="btn" onclick="closeOverlay()">GÉNIAL</button>
    </div>
  </div>

  <div id="register-modal">
    <div class="modal-box">
      <p style="color:var(--gold);font-weight:900;margin:0 0 10px;">VOTRE PROFIL</p>
      <div class="field">
        <label style="font-size:.85em;color:#bbb;">Pseudo</label>
        <input id="reg-name" placeholder="ex: Noeh" maxlength="20" />
      </div>
      <div class="field">
        <label style="font-size:.85em;color:#bbb;">Instagram (optionnel)</label>
        <input id="reg-ig" placeholder="@toninsta" maxlength="30" />
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;">
        <button class="btn dark" onclick="closeRegister()">Annuler</button>
        <button class="btn" onclick="saveRegister()">Valider</button>
      </div>
    </div>
  </div>

  <script>
    const CARD_DATA = [
      { id:'shots_1', name:'S - SHOTS', type:'puzzle' },
      { id:'shots_2', name:'H - SHOTS', type:'puzzle' },
      { id:'shots_3', name:'O - SHOTS', type:'puzzle' },
      { id:'shots_4', name:'T - SHOTS', type:'puzzle' },
      { id:'dj_1', name:'MUSIQUE 1/2', type:'puzzle' },
      { id:'dj_2', name:'MUSIQUE 2/2', type:'puzzle' },
      { id:'bouteille_a', name:'BOUT. GAUCHE', type:'rare' },
      { id:'bouteille_b', name:'BOUT. DROITE', type:'rare' },
      { id:'pompier', name:'POMPIER', type:'rare' },
      { id:'insta', name:'STAFF VIP', type:'rare' },
      { id:'cocktail', name:'MIXOLOGUE', type:'legend' },
      { id:'escorte', name:'ESCORTES', type:'legend' }
    ];

    const STORAGE_CARDS = 'cp9_cards';
    const STORAGE_PROFILE = 'cp9_profile';

    let collection = JSON.parse(localStorage.getItem(STORAGE_CARDS)) || [];
    let profile = JSON.parse(localStorage.getItem(STORAGE_PROFILE)) || null;

    function initGrid(){
      const gridPuzzles = document.getElementById('grid-puzzles');
      const gridExclu = document.getElementById('grid-exclu');
      gridPuzzles.innerHTML = '';
      gridExclu.innerHTML = '';

      CARD_DATA.forEach(card => {
        const div = document.createElement('div');
        div.className = `card-item ${collection.includes(card.id) ? 'active' : ''}`;
        
        const placeholder = `https://via.placeholder.com/300/111/d4af37?text=${card.id.toUpperCase()}`;

        div.innerHTML = `
          <span class="rarity-tag ${card.type}">${card.type}</span>
          <img src="${placeholder}" alt="${card.name}">
          <div class="card-label">${card.name}</div>
        `;

        if(card.type === 'puzzle') gridPuzzles.appendChild(div);
        else gridExclu.appendChild(div);
      });

      document.getElementById('count').innerText = collection.length;
      if(profile) document.getElementById('profile-badge').textContent = `Profil: ${profile.name}`;
    }

    function checkParams(){
      const urlParams = new URLSearchParams(window.location.search);
      const getCard = urlParams.get('get');

      if(getCard){
        const card = CARD_DATA.find(c => c.id === getCard);
        if(!card){
          alert("Carte inconnue");
          return;
        }

        if(!collection.includes(getCard)){
          collection.push(getCard);
          localStorage.setItem(STORAGE_CARDS, JSON.stringify(collection));
          runConfetti();
          showReward(card);
        } else {
          showOverlay("DÉJÀ POSSÉDÉE", `Tu as déjà la carte ${card.name}.`);
        }
        // Nettoie l'URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function showReward(card){
      const overlay = document.getElementById('reward-overlay');
      document.getElementById('reward-title').innerText = "NOUVELLE CARTE !";
      document.getElementById('reward-desc').innerText = `Tu as débloqué : ${card.name}\n\nContinue la collection pour gagner des verres !`;
      overlay.style.display = 'flex';
      initGrid();
    }

    function showOverlay(t, d){
      const overlay = document.getElementById('reward-overlay');
      document.getElementById('reward-title').innerText = t;
      document.getElementById('reward-desc').innerText = d;
      overlay.style.display = 'flex';
    }

    function closeOverlay(){
      document.getElementById('reward-overlay').style.display = 'none';
    }

    function openRegister(){
      document.getElementById('register-modal').style.display = 'flex';
    }

    function closeRegister(){
      document.getElementById('register-modal').style.display = 'none';
    }

    function saveRegister(){
      const name = document.getElementById('reg-name').value.trim();
      const ig = document.getElementById('reg-ig').value.trim();
      if(!name) return alert("Pseudo requis");

      profile = { name, ig };
      localStorage.setItem(STORAGE_PROFILE, JSON.stringify(profile));
      closeRegister();
      initGrid();
    }

    function resetAll(){
      if(confirm("Supprimer ta collection ?")){
        localStorage.clear();
        location.reload();
      }
    }

    // --- CONFETTI ---
    const confettiCanvas = document.getElementById('confetti');
    const ctx = confettiCanvas.getContext('2d');
    function resize(){ confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    function runConfetti(){
      const W = confettiCanvas.width, H = confettiCanvas.height;
      const pieces = [];
      for(let i=0; i<100; i++){
        pieces.push({
          x: Math.random()*W, y: -20, r: 5+Math.random()*5,
          vx: -2+Math.random()*4, vy: 2+Math.random()*5,
          c: ['#d4af37','#0077b6','#ffffff'][Math.floor(Math.random()*3)]
        });
      }
      function tick(){
        ctx.clearRect(0,0,W,H);
        pieces.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.02;
          ctx.fillStyle = p.c;
          ctx.fillRect(p.x, p.y, p.r, p.r);
        });
        if(pieces.some(p => p.y < H)) requestAnimationFrame(tick);
      }
      tick();
    }

    window.onload = () => { initGrid(); checkParams(); };
  </script>
</body>
</html>
