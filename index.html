<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP9 SQUADRA - Nice</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #000; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; border: 1px solid #333; padding: 20px; border-radius: 10px; }
        .badge-box { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
        .badge { width: 35px; height: 35px; border: 1px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; color: #555; }
        .active { background: #fff; color: #000; border: 1px solid #fff; box-shadow: 0 0 15px #fff; }
        .redirect-msg { font-style: italic; color: #888; margin-top: 20px; min-height: 24px; }
        #win-section { display: none; background: #111; padding: 20px; border: 2px solid #fff; margin-top: 20px; border-radius: 10px; animation: blink 1s infinite; }
        @keyframes blink { 0% { border-color: #fff; } 50% { border-color: #555; } 100% { border-color: #fff; } }
        input { padding: 12px; margin: 10px 0; width: 90%; background: #222; border: 1px solid #444; color: #fff; }
        button { padding: 12px 20px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; width: 95%; }
        button:hover { background: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>CP9 SQUADRA</h1>
        <p>CHASSE AU TRÉSOR : NICE CITY</p>

        <div class="badge-box" id="badges-container"></div>
        <p id="status-text">Scanne une affiche pour débloquer un son...</p>

        <div id="redirect-info" class="redirect-msg"></div>

        <div id="win-section">
            <h2>🏆 ACCÈS VIP DÉBLOQUÉ</h2>
            <p>Tu as trouvé les 10 affiches. Entre tes infos pour la récompense :</p>
            <form action="https://formspree.io/f/TON_ID_ICI" method="POST">
                <input type="text" name="pseudo" placeholder="Ton Pseudo (Insta/Snap)" required>
                <input type="email" name="email" placeholder="Ton Email" required>
                <input type="hidden" name="badges" value="10/10 - GAGNÉ">
                <button type="submit">VALIDER MON ACCÈS</button>
            </form>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION : Tes liens de musique (Remplace par tes vrais liens)
        const catalogueMusique = {
            "track1": "https://open.spotify.com/intl-fr/track/3YaERs9KECrvl9qBYskLFW?si=7f7b52eb0ab14c38",
            "track2": "https://open.spotify.com/track/LINK_2",
            "track3": "https://open.spotify.com/track/LINK_3",
            "track4": "https://open.spotify.com/track/LINK_4",
            "track5": "https://open.spotify.com/track/LINK_5",
            "track6": "https://open.spotify.com/track/LINK_6",
            "track7": "https://open.spotify.com/track/LINK_7",
            "track8": "https://open.spotify.com/track/LINK_8",
            "track9": "https://open.spotify.com/track/LINK_9",
            "track10": "https://open.spotify.com/track/LINK_10"
        };

        const nTotal = 10;
        const container = document.getElementById('badges-container');
        const infoDiv = document.getElementById('redirect-info');

        // 2. Création visuelle des badges
        for (let i = 1; i <= nTotal; i++) {
            let b = document.createElement('div');
            b.id = 'b' + i;
            b.className = 'badge';
            b.innerText = i;
            container.appendChild(b);
        }

        // 3. Récupération des paramètres URL
        const params = new URLSearchParams(window.location.search);
        const badgeId = params.get('badge');
        const songId = params.get('song');

        // 4. Gestion des badges (LocalStorage)
        let found = JSON.parse(localStorage.getItem('cp9_badges')) || [];
        if (badgeId && !found.includes(badgeId)) {
            found.push(badgeId);
            localStorage.setItem('cp9_badges', JSON.stringify(found));
        }

        // Mise à jour visuelle
        found.forEach(id => {
            const el = document.getElementById('b' + id);
            if (el) el.classList.add('active');
        });

        document.getElementById('status-text').innerText = `Progression : ${found.length} / ${nTotal}`;

        // 5. Redirection vers la musique
        if (songId && catalogueMusique[songId]) {
            infoDiv.innerText = "Chargement du morceau exclusif...";
            setTimeout(() => {
                window.location.href = catalogueMusique[songId];
            }, 2500); // 2.5 secondes de délai
        }

        // 6. Vérification victoire
        if (found.length >= nTotal) {
            document.getElementById('win-section').style.display = 'block';
            document.getElementById('status-text').style.display = 'none';
        }
    </script>
</body>
</html>
