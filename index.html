<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP9 SQUADRA - COLLECTION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confetti"></canvas>
    
    <div class="header">
        <h1>CP9 SQUADRA</h1>
        <p>NICE NIGHTLIFE • COLLECTION</p>
    </div>

    <div class="status-panel">
        <div class="status-left">
            <div id="filter-title" class="gold-text">TOUTE LA COLLECTION</div>
            <div class="count-text"><span id="count">0</span> / <span id="total-available">0</span></div>
            <div id="profile-badge" class="small-text">Chargement...</div>
        </div>
        <div id="auth-controls"></div>
    </div>

    <div id="back-btn-container" style="display:none; margin: 10px 0;">
        <button class="pill gold" onclick="renderAll(null)">⬅ RETOUR COLLECTION COMPLETE</button>
    </div>

    <h3 class="bar-title">🏠 ÉTABLISSEMENTS</h3>
    <div class="card-container" id="grid-bar"></div>

    <h3 class="puzzle-title">🧩 PUZZLES</h3>
    <div class="card-container" id="grid-puzzle"></div>

    <h3 class="rare-title">💎 RARETÉS</h3>
    <div class="card-container" id="grid-rare"></div>

    <hr class="divider">
    <h3 class="gold-text">🎁 RÉCOMPENSES</h3>
    <div class="reward-list" id="reward-list"></div>

    <div id="auth-modal" class="modal">
        <div class="modal-box">
            <h2 id="auth-title">REJOINDRE LA SQUADRA</h2>
            <div id="auth-error" class="error-message" style="display:none;"></div>

            <div id="signup-form">
                <div class="field"><label>Email</label><input id="reg-email" type="email" placeholder="ton@email.com"></div>
                <div class="field"><label>Mot de passe</label><input id="reg-pass" type="password" placeholder="Min. 6 caractères"></div>
                <div class="field"><label>Confirmer mot de passe</label><input id="reg-pass-confirm" type="password" placeholder="Confirme ton mot de passe"></div>
                <button class="btn" id="signup-btn" onclick="handleSignup()">S'INSCRIRE</button>
                <p class="toggle-auth">Déjà inscrit ? <span onclick="toggleAuthMode()" style="color: var(--gold); cursor: pointer;">SE CONNECTER</span></p>
            </div>

            <div id="login-form" style="display:none;">
                <div class="field"><label>Email</label><input id="login-email" type="email" placeholder="ton@email.com"></div>
                <div class="field"><label>Mot de passe</label><input id="login-pass" type="password" placeholder="Ton mot de passe"></div>
                <button class="btn" id="login-btn" onclick="handleLogin()">SE CONNECTER</button>
                <p class="toggle-auth">Pas encore inscrit ? <span onclick="toggleAuthMode()" style="color: var(--gold); cursor: pointer;">S'INSCRIRE</span></p>
            </div>

            <button class="btn secondary" onclick="closeAuthModal()">ANNULER</button>
        </div>
    </div>

    <div id="reward-overlay" class="modal">
        <div class="modal-box">
            <h2 id="reward-title">BRAVO !</h2>
            <p id="reward-desc"></p>
            <button class="btn" onclick="closeOverlay()">GÉNIAL</button>
        </div>
    </div>

    <div id="card-reveal-modal" class="modal">
        <div class="card-reveal-container">
            <div class="card-reveal-glow"></div>
            <div class="card-reveal-content">
                <div class="reveal-card">
                    <span id="reveal-rarity" class="rarity-tag"></span>
                    <div class="img-container">
                        <img id="reveal-img" src="" alt="Carte">
                    </div>
                    <div class="card-label" id="reveal-name"></div>
                </div>
                <h2 class="reveal-title">NOUVELLE CARTE DÉBLOQUÉE</h2>
                <p id="reveal-message" class="reveal-message"></p>
                <button class="btn" onclick="closeCardReveal()">AJOUTER À MA COLLECTION</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
